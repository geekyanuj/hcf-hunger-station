# Production nginx config: terminates TLS, redirects HTTP -> HTTPS, proxies
# /api and /socket.io to the API container, everything else to the static
# web build. See docs/DEPLOYMENT.md for how to obtain and mount certificates
# (Let's Encrypt/certbot or a purchased certificate) at the paths below.
#
# To use this file instead of the default HTTP-only docker/nginx.conf,
# uncomment its volume mounts in docker-compose.yml and place your certs at
# ./docker/certs/fullchain.pem and ./docker/certs/privkey.pem.

upstream api_upstream {
    server api:4000;
}

upstream web_upstream {
    server web:80;
}

# Plain HTTP: redirect everything to HTTPS, except the ACME HTTP-01
# challenge path certbot uses to issue/renew certificates.
server {
    listen 80;
    server_name _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # HSTS - once you're confident HTTPS is stable, consider raising
    # max-age and adding `preload` (submit to hstspreload.org only after
    # testing thoroughly, since preload is hard to reverse).
    add_header Strict-Transport-Security "max-age=15768000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 5m;

    location /api/ {
        proxy_pass http://api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /uploads/ {
        proxy_pass http://api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /socket.io/ {
        proxy_pass http://api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400; # keep long-lived websocket connections open
    }

    location / {
        proxy_pass http://web_upstream;
        proxy_set_header Host $host;
    }
}
