# Production-style reverse proxy: a single public entrypoint (port 80) that
# routes /api and /socket.io to the API service, and everything else to the
# static web build. Use this profile when you want ONE exposed port; for
# local development docker-compose also exposes api:4000 and web:5173 directly.

upstream api_upstream {
    server api:4000;
}

upstream web_upstream {
    server web:80;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 5m;

    location /api/ {
        proxy_pass http://api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /uploads/ {
        proxy_pass http://api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /socket.io/ {
        proxy_pass http://api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    location / {
        proxy_pass http://web_upstream;
        proxy_set_header Host $host;
    }
}
