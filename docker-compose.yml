
services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-hcf_admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-change_me_strong_password}
    volumes:
      - mongo_data:/data/db
    ports:
      - '27017:27017'
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Used for one concrete purpose: caching the public menu read endpoint
  # (GET /menu) and, optionally, as a shared store for express-rate-limit in
  # a multi-instance deployment. The API degrades gracefully (falls back to
  # direct MongoDB reads) if this service is stopped or unreachable — see
  # apps/api/src/config/redis.ts. Not a hard dependency.
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    ports:
      - '6379:6379'
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
      MONGO_URI: mongodb://${MONGO_ROOT_USER:-hcf_admin}:${MONGO_ROOT_PASSWORD:-change_me_strong_password}@mongo:27017/hcf_ros?authSource=admin
      REDIS_URL: redis://redis:6379
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-change_me_access_secret_min_32_chars}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-change_me_refresh_secret_min_32_chars}
      JWT_ACCESS_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
      PAYMENT_PROVIDER: MOCK
      PAYMENT_WEBHOOK_SECRET: ${PAYMENT_WEBHOOK_SECRET:-change_me_webhook_secret}
      # Thermal token printer - set these in the root .env (see docs/PRINTING.md). DISABLED = browser print.
      PRINTER_DRIVER: ${PRINTER_DRIVER:-DISABLED}
      PRINTER_HOST: ${PRINTER_HOST:-}
      PRINTER_PORT: ${PRINTER_PORT:-9100}
      PRINTER_DEVICE_PATH: ${PRINTER_DEVICE_PATH:-}
      PRINTER_PAPER_WIDTH: ${PRINTER_PAPER_WIDTH:-80}
      PRINTER_TIMEOUT_MS: ${PRINTER_TIMEOUT_MS:-5000}
      PRINTER_CUT: ${PRINTER_CUT:-true}
      PRINTER_OPEN_DRAWER: ${PRINTER_OPEN_DRAWER:-false}
      PRINTER_COPIES: ${PRINTER_COPIES:-1}
      PRINTER_FOOTER: ${PRINTER_FOOTER:-Thank you! Visit again}
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - '4001:4000'
    volumes:
      - api_uploads:/app/uploads

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:4001/api/v1}
        VITE_SOCKET_URL: ${VITE_SOCKET_URL:-http://localhost:4001}
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - '5174:80'

volumes:
  mongo_data:
  redis_data:
  api_uploads:
