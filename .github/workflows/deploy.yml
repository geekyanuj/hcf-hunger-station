name: Test VPS SSH

on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Test SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          port: ${{ secrets.VPS_PORT }}
          key: ${{ secrets.VPS_SSH_KEY }}

          timeout: 30s
          command_timeout: 1m
          script_stop: true
          debug: true

          script: |
            echo "SSH connected"
            whoami
            hostname
            echo "Done"
